name: Test and publish npm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yarn-helper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Node 26 on ${{ matrix.os }} (npm ${{ matrix.npm }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        npm: [bundled]
        include:
          - os: ubuntu-latest
            npm: latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          check-latest: true
          cache: npm
          package-manager-cache: false
      - if: matrix.npm == 'latest'
        run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:smoke
      - name: Bootstrap the runner's Node prefix
        run: node bin/yarn-helper.mjs setup

  alpine:
    name: Packed CLI on Node 26 Alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the published file layout and npx entry point
        run: |
          docker run --pull=always --rm -v "$PWD:/src:ro" node:26-alpine sh -eu -c '
            mkdir /test
            cp -R /src/. /test/
            cd /test
            npm ci
            npm run check
            npm test
            npm pack --pack-destination /tmp
            set -- /tmp/zyno-io-yarn-helper-*.tgz
            HELPER_SMOKE_PACKAGE="$1" npm run test:smoke
          '

  publish:
    name: Publish with npm trusted publishing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, alpine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          check-latest: true
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Verify the release tag
        run: node --input-type=module -e 'import fs from "node:fs"; const manifest = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${manifest.version}`) throw new Error("Tag must match package.json version");'
      - run: npm publish --access public --provenance
